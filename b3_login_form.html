<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Đăng Nhập</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            padding: 50px;
        }
        input:focus {
            outline: none;
            border-color: #4CAF50;
        }
        button:hover {
            background-color: #45a049 !important;
        }
    </style>
</head>
<body>
    <div style="background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); max-width: 400px;">
        <h2 style="color: #333; margin-bottom: 20px;">Đăng Nhập</h2>
        
        <div style="margin-bottom: 15px;">
            <label for="txtUsername" style="display: block; margin-bottom: 5px; color: #555; width: auto;">Ten Dang Nhap:</label>
            <input type="text" id="txtUsername" name="username" style="width: 100%; padding: 8px; box-sizing: border-box;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <label for="txtPassword" style="display: block; margin-bottom: 5px; color: #555; width: auto;">Password:</label>
            <input type="password" id="txtPassword" name="txtPassword" style="width: 100%; padding: 8px; box-sizing: border-box;">
        </div>
        
        <div style="margin-bottom: 15px;">
            <button type="button" id="btnLogin" onclick="login()" style="width: 100%; padding: 10px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px;">Đăng Nhập</button>
        </div>
    </div>

</body>
</html>
